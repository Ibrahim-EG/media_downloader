name: Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          elif [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          else
            echo "sdkmanager not found, continuing"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Ensure required files exist
        run: |
          mkdir -p app
          mkdir -p app/src/main/res/drawable
          touch app/proguard-rules.pro
          if [ ! -f gradle.properties ]; then
            echo "org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8" >> gradle.properties
            echo "org.gradle.parallel=true" >> gradle.properties
            echo "org.gradle.caching=true" >> gradle.properties
            echo "android.useAndroidX=true" >> gradle.properties
            echo "android.nonTransitiveRClass=true" >> gradle.properties
            echo "kotlin.code.style=official" >> gradle.properties
          fi

      - name: Create placeholder icon if missing
        run: |
          if [ ! -f app/src/main/res/drawable/icon.png ]; then
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/drawable/icon.png
          fi

      - name: Build debug APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: echo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
